name: CI

on:
  push:
    branches: [ raw ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: actual build release
      run: set -o pipefail && xcodebuild archive \
        -project Blink.xcodeproj \
        -scheme Blink \
        -sdk iphoneos \
        -configuration Release \
        IPHONEOS_DEPLOYMENT_TARGET='16.1' \
        CODE_SIGN_IDENTITY='' \
        CODE_SIGN_ENTITLEMENTS='' \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO \
        GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
        STRIP_INSTALLED_PRODUCT=YES \
        ONLY_ACTIVE_ARCH=NO

    - name: generate unsigned release ipa
      run: |
        cd ~
        mkdir Payload
        mv ~/Library/Developer/Xcode/Archives/*/*/Products/Applications/Blink.app ~/Payload/
        zip -r -9 Blink.ipa Payload
    - name: upload ipa
      uses: actions/upload-artifact@v4
      with:
        name: 'BlinkShell'
        path: ~/Blink.ipa
